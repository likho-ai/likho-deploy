# Made by scripts/sync-env.py staging from each repository's .env.staging. Do not edit here:
# change the .env file in the service's repository and run the script again.
services:
  likho-api:
    config:
      LIKHO_ENV: "staging"
      LOG_LEVEL: "info"
      HTTP_PORT: "4000"
      REDIS_URL: "redis://redis:6379"
