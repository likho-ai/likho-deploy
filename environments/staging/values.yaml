# Staging: the images CI publishes from the staging branch (:staging), from GitHub Container Registry.
# A merge into a service's staging branch publishes its :staging image; `.\scripts\deploy.ps1
# staging` rolls it out. To hold one service back, pin its line to a sha-<commit> tag.
imagePullSecrets: [ghcr-pull]      # made by scripts/secrets.py with GHCR_USER and GHCR_TOKEN set

services:
  likho-api: { image: ghcr.io/likho-ai/likho-api:staging }
  likho-media: { image: ghcr.io/likho-ai/likho-media:staging }
  likho-transcription: { image: ghcr.io/likho-ai/likho-transcription:staging }
  likho-language: { image: ghcr.io/likho-ai/likho-language:staging }
  likho-web-shell: { image: ghcr.io/likho-ai/likho-web-shell:staging }
  likho-mfe-library: { image: ghcr.io/likho-ai/likho-mfe-library:staging }
  likho-mfe-transcript: { image: ghcr.io/likho-ai/likho-mfe-transcript:staging }
  likho-mfe-admin: { image: ghcr.io/likho-ai/likho-mfe-admin:staging }
  likho-mfe-vocabulary: { image: ghcr.io/likho-ai/likho-mfe-vocabulary:staging }
  likho-search: { image: ghcr.io/likho-ai/likho-search:staging }
  likho-insights: { image: ghcr.io/likho-ai/likho-insights:staging }
  likho-analytics: { image: ghcr.io/likho-ai/likho-analytics:staging }
  likho-mfe-insights: { image: ghcr.io/likho-ai/likho-mfe-insights:staging }

# Switch on once the staging domain is known; it must match PUBLIC_DOMAIN in
# likho-infra/.env.staging.local (PUBLIC_ORIGIN and PUBLIC_URL are derived from it). The
# Gateway (NGINX Gateway Fabric or the cloud's own) and its certificate belong to the cluster.
route:
  enabled: false
  hostnames: []                     # e.g. [staging.likho.example.com]
  parent: { name: likho, namespace: nginx-gateway, sectionName: https }
