# The backing services in the production cluster: one replica each, on persistent volumes.
# A managed PostgreSQL, MongoDB or S3 is the step up: set <part>.enabled: false here and point
# the service's .env.production.local at it. Back the volumes up with the cluster's snapshots.
postgres:
  storage: 50Gi
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
mongo:
  storage: 50Gi
  wiredTigerCacheGB: "1"
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
redis:
  maxmemory: 256mb
  resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 320Mi } }
nats:
  storage: 20Gi
objectstore:
  storage: 500Gi                    # about 10 MB per hour of telephone audio plus the playback copies
  volumeSizeLimitMB: 1024
  resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1Gi } }
meilisearch:
  storage: 20Gi
  resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 2Gi } }

# Scale and operations: the databases only reachable from Likho's pods, nightly dumps with a
# monthly restore drill, and nightly volume snapshots (the audio). Point backup.s3 at a bucket
# outside this cluster (and its keys in a Secret) before the first release.
networkPolicy: { enabled: true }
backup:
  timeZone: Asia/Kolkata
  keepDays: 30
  scratchSize: 100Gi
snapshots: { enabled: true }