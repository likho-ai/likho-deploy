{{- $g := .Values.gateway }}
{{- $api := include "likho.upstream" (dict "ctx" $ "name" "likho-api" "port" (index .Values.services "likho-api").ports.http) }}
{{- $media := include "likho.upstream" (dict "ctx" $ "name" "likho-media" "port" (index .Values.services "likho-media").ports.http) }}
{{- $shell := include "likho.upstream" (dict "ctx" $ "name" "likho-web-shell" "port" (index .Values.services "likho-web-shell").ports.http) }}
{{- $library := include "likho.upstream" (dict "ctx" $ "name" "likho-mfe-library" "port" (index .Values.services "likho-mfe-library").ports.http) }}
{{- $transcript := include "likho.upstream" (dict "ctx" $ "name" "likho-mfe-transcript" "port" (index .Values.services "likho-mfe-transcript").ports.http) }}
# The gateway: one address for the web app and every API. The same routes as the local stack's
# nginx (likho-infra/nginx/nginx.conf); the upstreams are the cluster's Services, looked up at
# request time so the gateway serves even while a service is down or being replaced.
apiVersion: v1
kind: ConfigMap
metadata:
  name: likho-gateway
  labels: {{- include "likho.labels" . | nindent 4 }}
data:
  manifest.json: {{ $g.manifest | toJson | quote }}
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      access_log    off;
      client_max_body_size {{ $g.maxBodySize }};

      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      # Behind a Gateway that ends TLS, the scheme the browser used; otherwise our own.
      map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

      # The cluster's DNS, filled in at start from /etc/resolv.conf. Names are complete
      # (service.namespace.svc.cluster-domain): nginx's resolver uses no search list.
      resolver __RESOLVER__ valid=10s ipv6=off;

      server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id      $request_id;
        # A location that sets a proxy_set_header of its own loses these; such locations repeat them.

        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

        # likho-api: GraphQL, REST, API docs
        location /graphql {
          set $api http://{{ $api }};
          proxy_pass $api;
        }
        location /api/ {
          set $api http://{{ $api }};
          proxy_pass $api;
        }
        # Live transcript lines (server-sent events): never buffer, keep the connection open.
        location /events/ {
          set $api http://{{ $api }};
          proxy_pass $api;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 1h;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Request-Id      $request_id;
          proxy_set_header Connection '';
        }

        # likho-media: uploads and audio streaming with range requests
        location /media/ {
          set $media http://{{ $media }};
          proxy_pass $media;
          proxy_request_buffering off;
          proxy_read_timeout 10m;
        }

        # The web apps the shell loads at run time (Module Federation).
        location = /mfe/manifest.json {
          root /etc/nginx/mfe-root;
          add_header Cache-Control "no-store";
        }
        location /mfe/library/ {
          set $library http://{{ $library }};
          proxy_pass $library;
        }
        location /mfe/transcript/ {
          set $transcript http://{{ $transcript }};
          proxy_pass $transcript;
        }

        # The web shell
        location / {
          set $web http://{{ $shell }};
          proxy_pass $web;
        }

        error_page 502 503 504 = @down;
        location @down {
          default_type application/json;
          return 502 '{"error":{"code":"service_unavailable","message":"The service behind this path is not running."}}\n';
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: likho-gateway
  labels: {{- include "likho.labels" . | nindent 4 }}
spec:
  type: {{ $g.service.type }}
  selector: {{- include "likho.selector" "likho-gateway" | nindent 4 }}
  ports:
    - name: http
      port: {{ $g.service.port }}
      targetPort: http
      {{- if and (eq $g.service.type "NodePort") $g.service.nodePort }}
      nodePort: {{ $g.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: likho-gateway
  labels: {{- include "likho.labels" . | nindent 4 }}
spec:
  replicas: {{ $g.replicas }}
  selector:
    matchLabels: {{- include "likho.selector" "likho-gateway" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "likho.selector" "likho-gateway" | nindent 8 }}
      annotations:
        checksum/config: {{ (dict "nginx" $g "api" $api "media" $media "shell" $shell "library" $library "transcript" $transcript) | toJson | sha256sum }}
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: {{ $g.image | quote }}
          # nginx's resolver has to be the cluster's DNS address, which only the pod knows.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              resolver=$(awk '/^nameserver/ { print $2; exit }' /etc/resolv.conf)
              sed "s/__RESOLVER__/$resolver/" /etc/nginx/templates/nginx.conf > /etc/nginx/nginx.conf
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/templates/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: config, mountPath: /etc/nginx/mfe-root/mfe/manifest.json, subPath: manifest.json, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{- toYaml $g.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: likho-gateway }
