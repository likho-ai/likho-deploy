{{- /*
One ConfigMap, one Service and one workload per entry of .Values.services. The workload is a
Deployment (with a PersistentVolumeClaim per volume it asks for), or a StatefulSet when the
service says `kind: StatefulSet` - then every pod gets volumes of its own (volumeClaimTemplates),
which is what lets a worker with a model cache run more than one replica. The container's
environment is the ConfigMap, then the Secret, then the explicit `env` values - a later source wins.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if include "likho.enabled" $svc }}
{{- $probePort := "http" }}
{{- $kind := $svc.kind | default "Deployment" }}
{{- $replicas := int (include "likho.minReplicas" (dict "ctx" $ "svc" $svc)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-env
  labels: {{- include "likho.labels" $ | nindent 4 }}
data:
  {{- range $key, $value := ($svc.config | default dict) }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "likho.labels" $ | nindent 4 }}
spec:
  {{- if $svc.headless }}
  clusterIP: None
  {{- end }}
  selector: {{- include "likho.selector" $name | nindent 4 }}
  ports:
    {{- range $portName, $port := $svc.ports }}
    - name: {{ $portName }}
      port: {{ $port }}
      targetPort: {{ $portName }}
    {{- end }}
{{- if ne $kind "StatefulSet" }}
{{- range $volume := ($svc.volumes | default list) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-{{ $volume.name }}
  labels: {{- include "likho.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $volume.storageClass }}
  storageClassName: {{ $volume.storageClass | quote }}
  {{- end }}
  resources: { requests: { storage: {{ $volume.size }} } }
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ $name }}
  labels: {{- include "likho.labels" $ | nindent 4 }}
spec:
  {{- if not (include "likho.autoscaled" (dict "ctx" $ "svc" $svc)) }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  {{- if eq $kind "StatefulSet" }}
  serviceName: {{ $name }}
  # Workers are interchangeable: start and stop them together, not one ordinal at a time.
  podManagementPolicy: Parallel
  {{- else if $svc.volumes }}
  strategy: { type: Recreate }   # a ReadWriteOnce volume: the new pod waits for the old one
  {{- end }}
  selector:
    matchLabels: {{- include "likho.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "likho.selector" $name | nindent 8 }}
        {{- if ne ($svc.metrics | default true) false }}
        likho.ai/metrics: "true"        # the PodMonitor scrapes these (templates/alerts.yaml)
        {{- end }}
      annotations:
        # A changed setting restarts the pods, so a ConfigMap edit is never silently ignored.
        checksum/config: {{ ($svc.config | default dict) | toJson | sha256sum }}
        {{- if ne ($svc.metrics | default true) false }}
        # Every service serves Prometheus text at /metrics on its HTTP port; the cluster's
        # Prometheus may scrape it (or set OTEL_EXPORTER_OTLP_ENDPOINT to push).
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ $svc.ports.http | quote }}
        {{- end }}
    spec:
      {{- with $svc.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with $svc.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (gt $replicas 1) (include "likho.autoscaled" (dict "ctx" $ "svc" $svc)) }}
      {{- include "likho.spread" (dict "ctx" $ "name" $name) | nindent 6 }}
      {{- end }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        {{- if $svc.volumes }}
        # The images run as uid 10001; the volume is made writable for that group.
        fsGroup: {{ $svc.fsGroup | default 10001 }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $svc.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy | default (include "likho.pullPolicy" $svc.image) }}
          securityContext: {{- toYaml (hasKey $svc "securityContext" | ternary $svc.securityContext $.Values.containerSecurityContext) | nindent 12 }}
          ports:
            {{- range $portName, $port := $svc.ports }}
            - name: {{ $portName }}
              containerPort: {{ $port }}
            {{- end }}
          envFrom:
            - configMapRef: { name: {{ $name }}-env }
            {{- if $svc.secret }}
            - secretRef: { name: {{ $svc.secret }} }
            {{- end }}
          {{- with $svc.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- end }}
          {{- with $svc.readiness }}
          readinessProbe:
            httpGet: { path: {{ .path }}, port: {{ .port | default $probePort }} }
            initialDelaySeconds: {{ .initialDelaySeconds | default 5 }}
            periodSeconds: {{ .periodSeconds | default 5 }}
            timeoutSeconds: 3
          {{- end }}
          {{- with $svc.liveness }}
          livenessProbe:
            httpGet: { path: {{ .path }}, port: {{ .port | default $probePort }} }
            initialDelaySeconds: {{ .initialDelaySeconds | default 30 }}
            periodSeconds: {{ .periodSeconds | default 15 }}
            timeoutSeconds: 3
            failureThreshold: 4
          {{- end }}
          {{- with $svc.volumes }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
          resources: {{- toYaml ($svc.resources | default dict) | nindent 12 }}
      {{- if and $svc.volumes (ne $kind "StatefulSet") }}
      volumes:
        {{- range $svc.volumes }}
        - name: {{ .name }}
          persistentVolumeClaim: { claimName: {{ $name }}-{{ .name }} }
        {{- end }}
      {{- end }}
  {{- if and $svc.volumes (eq $kind "StatefulSet") }}
  volumeClaimTemplates:
    {{- range $svc.volumes }}
    - metadata:
        name: {{ .name }}
        labels: {{- include "likho.selector" $name | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .storageClass }}
        storageClassName: {{ .storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .size }} } }
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
