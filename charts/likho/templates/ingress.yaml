{{- if .Values.ingress.enabled }}
# The public hostname: everything goes to the gateway, which knows the routes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: likho
  labels: {{- include "likho.labels" . | nindent 4 }}
  annotations:
    # Uploads of whole call recordings and hour-long event streams pass through here.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.gateway.maxBodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: likho-gateway
                port: { number: {{ .Values.gateway.service.port }} }
{{- end }}
