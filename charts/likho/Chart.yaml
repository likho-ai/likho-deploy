apiVersion: v2
name: likho
description: The Likho product in a cluster - the services (likho-api, likho-media, likho-transcription, likho-language, likho-search, likho-insights, likho-analytics, likho-connector-ameyo), the web app (likho-web-shell, likho-mfe-library, likho-mfe-transcript, likho-mfe-admin, likho-mfe-vocabulary, likho-mfe-insights) and the gateway that gives them one address. Settings come from each repository's .env.<environment> (synced into environments/<environment>/env.yaml) and secrets from Secrets made by scripts/secrets.py.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/likho-ai/likho-deploy
