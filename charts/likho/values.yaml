# Every Likho service, keyed by the name its Service gets (the name the other services' .env
# files use: likho-media:5010, likho-transcription:5020, likho-language:5030).
#
# Where a service's settings come from, in order (a later one wins):
#   config:  the ConfigMap <name>-env, filled from the repository's .env.<environment>
#            (environments/<environment>/env.yaml, made by scripts/sync-env.py - never edited by hand)
#   secret:  the Secret <name>-secrets, made by scripts/secrets.py from .env.<environment>.local
#   env:     explicit values set here or in an environment's values.yaml (what differs in a cluster)
#
# headless: true gives the Service no cluster IP: clients that resolve it get the pods' own
# addresses, which is what gRPC needs to spread calls over replicas.
# image: the full reference. Skaffold sets it for the local cluster (built from the sibling
# checkout); staging and production pin a tag from GitHub Container Registry in their values.yaml.

imagePullSecrets: []        # [ghcr-pull] where the images are pulled from a private registry
imagePullPolicy: ""        # empty = Always for a floating tag, IfNotPresent for a pinned one
clusterDomain: cluster.local

# Applied to every service container; a service may replace it with its own `securityContext`.
containerSecurityContext:
  allowPrivilegeEscalation: false

# --- scale and operations (templates/scaling.yaml, networkpolicy.yaml, alerts.yaml) ----------
#
# Per service, beside the fields above:
#   autoscaling: { enabled, minReplicas, maxReplicas, cpu }   a HorizontalPodAutoscaler on CPU
#   keda:        { enabled, minReplicas, maxReplicas, stream, consumer, lagThreshold }
#                scale on a JetStream consumer's backlog (needs keda.enabled below)
#   kind:        StatefulSet gives every pod volumes of its own (the worker's model cache)
#   nodeSelector, tolerations, affinity: where the pods may run (a GPU node pool)
#   ingressFrom: the services allowed to connect to this one (networkPolicy.enabled)

# Spread the pods of a workload with two or more replicas over nodes and zones (soft).
spreadPods: true
# A PodDisruptionBudget (maxUnavailable 1) for every workload with two or more pods.
podDisruptionBudgets: true

# KEDA (https://keda.sh) installed in the cluster: the transcription worker follows the job queue.
keda:
  enabled: false
  natsMonitoringEndpoint: ""    # empty = nats.<namespace>.svc.<clusterDomain>:8222 (likho-stack)
  natsAccount: "$G"             # NATS without accounts configured

networkPolicy:
  enabled: false
  # Who may scrape /metrics on every service's http port: the cluster's Prometheus.
  metricsFrom:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  # Who may reach the gateway; empty = anyone (the cluster's Gateway or load balancer).
  gatewayFrom: []

# Alerting rules for the Prometheus Operator (a PrometheusRule): the queue, failures, disks,
# backups. Needs the operator's CRDs; `labels` is what its ruleSelector picks up.
alerts:
  enabled: false
  labels: {}                     # e.g. { release: kube-prometheus-stack }
  queueOldestMinutes: 15         # a job waiting longer than this
  failedJobsPerHour: 5           # more failed transcriptions than this in an hour
  diskFreePercent: 15            # a volume with less free space than this

services:
  likho-api:
    image: ghcr.io/likho-ai/likho-api:latest
    replicas: 1
    ports: { http: 4000 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-api-secrets
    config: {}
    env: {}
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, cpu: 70 }
    ingressFrom: [likho-gateway]          # the browser and the dialer connector come through it
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { memory: 512Mi }

  likho-media:
    image: ghcr.io/likho-ai/likho-media:latest
    replicas: 1
    headless: true          # gRPC clients resolve the pods and balance per call
    ports: { http: 4010, grpc: 5010 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-media-secrets
    config: {}
    env: {}
    # gateway: uploads and playback; likho-transcription: gRPC and the originals (INTERNAL_URL)
    ingressFrom: [likho-gateway, likho-api, likho-transcription]
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 768Mi }      # ffmpeg and peaks of one call at a time per worker

  likho-transcription:
    image: ghcr.io/likho-ai/likho-transcription:latest
    replicas: 1
    headless: true          # gRPC clients resolve the pods and balance per call
    ports: { http: 4020, grpc: 5020 }
    readiness: { path: /readyz, port: http, initialDelaySeconds: 20 }
    liveness: { path: /healthz, port: http, initialDelaySeconds: 60 }
    secret: likho-transcription-secrets
    config: {}
    env: {}
    # likho-ml: corrected lines for training examples, and evaluation transcriptions
    ingressFrom: [likho-api, likho-search, likho-insights, likho-ml]
    # A stopping pod finishes the job in hand first; a long call takes minutes.
    terminationGracePeriodSeconds: 900
    # A StatefulSet, so every worker keeps a model cache of its own across restarts and scaling.
    kind: StatefulSet
    # With KEDA: one more worker per job waiting, up to maxReplicas (each holds a model in memory,
    # or a GPU). The queue is the durable pull consumer every worker shares.
    keda:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      stream: LIKHO
      consumer: likho-transcription-requested
      lagThreshold: 1
    # The model cache (HF_HOME=/models): the turbo model is 1.6 GB, downloaded on the first job.
    volumes:
      - { name: models, mountPath: /models, size: 10Gi }
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { memory: 4Gi }        # the turbo model in int8 needs about 2.5 GB while decoding

  likho-language:
    image: ghcr.io/likho-ai/likho-language:latest
    replicas: 1
    headless: true          # gRPC clients resolve the pods and balance per call
    ports: { http: 4030, grpc: 5030 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-language-secrets
    config: {}
    env: {}
    ingressFrom: [likho-api, likho-transcription]
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }

  likho-search:
    image: ghcr.io/likho-ai/likho-search:latest
    replicas: 1
    headless: true          # gRPC clients resolve the pods and balance per call
    ports: { http: 4040, grpc: 5040 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-search-secrets
    config: {}
    env: {}
    ingressFrom: [likho-api]
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

  # Insights: asks a language model about every transcript. Analyses nothing until its Secret
  # carries ANTHROPIC_API_KEY (the company's yes to sending transcript text to the model).
  likho-insights:
    image: ghcr.io/likho-ai/likho-insights:latest
    replicas: 1
    headless: true          # gRPC clients resolve the pods and balance per call
    ports: { http: 4050, grpc: 5050 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-insights-secrets
    config: {}
    env: {}
    ingressFrom: [likho-api]
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 384Mi }

  # Analytics: every event into ClickHouse, and the numbers behind the calls.
  likho-analytics:
    image: ghcr.io/likho-ai/likho-analytics:latest
    replicas: 1
    headless: true          # gRPC clients resolve the pods and balance per call
    ports: { http: 4070, grpc: 5070 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-analytics-secrets
    config: {}
    env: {}
    ingressFrom: [likho-api]
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

  # The model service: the speech model registry and its default, the gold set and evaluations,
  # training examples from corrections. One instance: its evaluation queue lives in the process
  # (a second would fail the first one's evaluations at its start). Never autoscaled.
  likho-ml:
    image: ghcr.io/likho-ai/likho-ml:latest
    replicas: 1
    headless: true          # gRPC clients resolve the pods
    ports: { http: 4080, grpc: 5080 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-ml-secrets
    config: {}
    env: {}
    # likho-api (the admin screen), likho-transcription (which model is the default)
    ingressFrom: [likho-api, likho-transcription]
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 384Mi }

  # The dialer connector: no port of its own but health; it reaches likho-api through the gateway.
  likho-connector-ameyo:
    image: ghcr.io/likho-ai/likho-connector-ameyo:latest
    replicas: 1                     # one: the schedule and the durable consumers are per group
    ports: { http: 4060, grpc: 5060 }
    readiness: { path: /readyz, port: http }
    liveness: { path: /healthz, port: http }
    secret: likho-connector-ameyo-secrets
    config: {}
    env: {}
    ingressFrom: [likho-api]                # the dialer's campaigns and agents (gRPC)
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 384Mi }

  # The web app: static files behind nginx, no settings (the browser talks to the gateway's origin).
  likho-web-shell:
    image: ghcr.io/likho-ai/likho-web-shell:latest
    replicas: 1
    metrics: false                # static files: nothing to scrape
    ports: { http: 80 }
    readiness: { path: /healthz, port: http }
    liveness: { path: /healthz, port: http }
    securityContext: {}            # the nginx image starts as root and drops to nginx itself
    ingressFrom: [likho-gateway]
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, cpu: 80 }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  likho-mfe-library:
    image: ghcr.io/likho-ai/likho-mfe-library:latest
    replicas: 1
    metrics: false                # static files: nothing to scrape
    ports: { http: 80 }
    readiness: { path: /healthz, port: http }
    liveness: { path: /healthz, port: http }
    securityContext: {}
    ingressFrom: [likho-gateway]
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, cpu: 80 }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  likho-mfe-transcript:
    image: ghcr.io/likho-ai/likho-mfe-transcript:latest
    replicas: 1
    metrics: false                # static files: nothing to scrape
    ports: { http: 80 }
    readiness: { path: /healthz, port: http }
    liveness: { path: /healthz, port: http }
    securityContext: {}
    ingressFrom: [likho-gateway]
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, cpu: 80 }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  likho-mfe-admin:
    image: ghcr.io/likho-ai/likho-mfe-admin:latest
    replicas: 1
    metrics: false                # static files: nothing to scrape
    ports: { http: 80 }
    readiness: { path: /healthz, port: http }
    liveness: { path: /healthz, port: http }
    securityContext: {}
    ingressFrom: [likho-gateway]
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, cpu: 80 }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  likho-mfe-vocabulary:
    image: ghcr.io/likho-ai/likho-mfe-vocabulary:latest
    replicas: 1
    metrics: false                # static files: nothing to scrape
    ports: { http: 80 }
    readiness: { path: /healthz, port: http }
    liveness: { path: /healthz, port: http }
    securityContext: {}
    ingressFrom: [likho-gateway]
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, cpu: 80 }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  likho-mfe-insights:
    image: ghcr.io/likho-ai/likho-mfe-insights:latest
    replicas: 1
    metrics: false                # static files: nothing to scrape
    ports: { http: 80 }
    readiness: { path: /healthz, port: http }
    liveness: { path: /healthz, port: http }
    securityContext: {}
    ingressFrom: [likho-gateway]
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, cpu: 80 }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }

# The gateway: one address for the web app and every API (nginx, the same routes as
# likho-infra/nginx/nginx.conf, with the cluster's services as upstreams).
gateway:
  image: nginx:1.30.5-alpine
  replicas: 1
  maxBodySize: 1g             # call recordings are uploaded through /media
  service:
    type: ClusterIP           # LoadBalancer or NodePort where no Gateway fronts it
    port: 80
    nodePort: null
  # /mfe/manifest.json: which remote entry each app is at. A release of one app changes one line.
  manifest:
    library: /mfe/library/remoteEntry.js
    transcript: /mfe/transcript/remoteEntry.js
    admin: /mfe/admin/remoteEntry.js
    vocabulary: /mfe/vocabulary/remoteEntry.js
    insights: /mfe/insights/remoteEntry.js
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, cpu: 70 }
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

# The public hostname, through the cluster's Gateway (Gateway API). The Gateway itself - its
# listeners, the TLS certificate - belongs to the cluster, not to this chart; the route only
# sends the hostname to likho-gateway. Without a Gateway, set gateway.service.type to
# LoadBalancer (or NodePort) instead.
route:
  enabled: false
  hostnames: []              # e.g. [likho.example.com]
  parent:
    name: ""                 # the Gateway's name
    namespace: ""            # its namespace, when not this one
    sectionName: ""          # one listener of it (e.g. https), when not all
