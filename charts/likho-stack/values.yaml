# The backing services, one replica each, each behind a Service with the name the likho services
# use in their .env files: postgres, mongo, redis, nats, objectstore, meilisearch, clickhouse.
#
# Secrets come from one Secret made by scripts/secrets.py from likho-infra/.env.<environment>.local:
#   POSTGRES_PASSWORD, LIKHO_API_DB_PASSWORD, LIKHO_MEDIA_DB_PASSWORD, LIKHO_LANGUAGE_DB_PASSWORD,
#   LIKHO_CONNECTOR_DB_PASSWORD,
#   MONGO_ROOT_PASSWORD, MONGO_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY, MEILI_MASTER_KEY, CLICKHOUSE_PASSWORD
# plus a second Secret holding SeaweedFS's s3.json (the same S3 keys, in the file format it reads).
secrets:
  name: likho-stack-secrets
  s3Config: likho-stack-s3

# Storage class for every volume; empty = the cluster's default.
storageClass: ""

postgres:
  enabled: true
  image: postgres:17.11-alpine
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

mongo:
  enabled: true
  image: mongo:8.0.32
  storage: 5Gi
  wiredTigerCacheGB: "0.25"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

redis:
  enabled: true
  image: redis:8.10.2-alpine
  maxmemory: 96mb
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

nats:
  enabled: true
  image: nats:2.14.7-alpine
  storage: 2Gi
  serverName: likho
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  # The sidecar that creates the JetStream streams whenever the pod starts.
  init:
    image: natsio/nats-box:0.20.0

objectstore:
  enabled: true
  image: chrislusf/seaweedfs:4.48
  storage: 20Gi
  volumeSizeLimitMB: 256
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 384Mi }
  buckets: [likho-audio, likho-normalized, likho-peaks, likho-models, likho-backups]

meilisearch:
  enabled: true
  image: getmeili/meilisearch:v1.54.2
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# ClickHouse (likho-analytics): every event, and the numbers behind the calls. Held to
# maxServerMemoryBytes by its own config, below the pod's limit.
clickhouse:
  enabled: true
  image: clickhouse/clickhouse-server:25.8-alpine
  storage: 10Gi
  maxServerMemoryBytes: 1200000000
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1536Mi }

# Backups (templates/backup.yaml): nightly dumps of PostgreSQL, MongoDB and ClickHouse to S3,
# and a monthly drill that restores the newest into scratch databases and checks it.
# The default target is the in-cluster object store - fine to rehearse with, no use when the
# cluster is lost: point s3 at storage outside it (another cloud's bucket) for real use.
backup:
  enabled: true
  schedule: "30 2 * * *"           # every night (the cluster's time zone unless timeZone is set)
  timeZone: ""                     # e.g. Asia/Kolkata
  keepDays: 14
  image: amazon/aws-cli:2.31.0
  scratchSize: 20Gi                # the dumps are written to the pod's disk before the upload
  deadlineSeconds: 7200
  s3:
    endpoint: http://objectstore:8333   # empty = AWS S3 itself
    region: us-east-1
    bucket: likho-backups
    prefix: ""                     # empty = <namespace>/
    secret: ""                     # empty = S3_ACCESS_KEY/S3_SECRET_KEY above; else a Secret
                                   # with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  drill:
    enabled: true
    schedule: "0 4 1 * *"          # the first of every month
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }

# VolumeSnapshots of the volumes through the cluster's CSI snapshot class - the audio in the
# object store is too big to dump every night. Needs the snapshot CRDs and a VolumeSnapshotClass.
snapshots:
  enabled: false
  schedule: "0 3 * * *"
  className: ""                    # empty = the cluster's default VolumeSnapshotClass
  keepDays: 7
  image: alpine/k8s:1.34.1
  claims: [data-objectstore-0, data-postgres-0, data-mongo-0, data-clickhouse-0, data-nats-0]

networkPolicy:
  enabled: false
  # Who may read NATS's monitoring port besides Likho's pods: KEDA (the queue's backlog), Prometheus.
  natsMonitorFrom:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keda } }
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }