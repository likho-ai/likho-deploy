{{- if .Values.redis.enabled }}
# Redis: a cache and the live-line fan-out between likho-api replicas. Nothing persisted.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "likho-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "likho-stack.selector" "redis" | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "likho-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "likho-stack.selector" "redis" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "likho-stack.selector" "redis" | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: [redis-server, --save, "", --appendonly, "no", --maxmemory, {{ .Values.redis.maxmemory | quote }}, --maxmemory-policy, allkeys-lru]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
