# The local loop: Likho's own services in the local cluster (minikube), through Skaffold.
#
#   skaffold dev     builds every image from the sibling checkouts, deploys the product, forwards
#                    the gateway to http://localhost:8080, and rebuilds and redeploys what you change
#   skaffold run     the same, once (every pod of the product restarts: Skaffold labels each run)
#
# The backing services (charts/likho-stack) are not Skaffold's: scripts/local.ps1 installs them
# with Helm once, so a redeploy never restarts a database or the event bus. Staging and
# production are Helm releases of both charts: scripts/deploy.ps1 <environment>.
#
# The product chart is rendered with Helm (scripts/render.py, run before every deploy) and
# applied with kubectl; Skaffold puts the images it built into the rendered objects itself.
# (Skaffold 2.25's own Helm support installs a post-renderer plugin whose manifest Helm 4 cannot
# read on Windows.) A chart change needs a new run.
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: likho

build:
  local:
    useBuildkit: true
    concurrency: 2
    push: false            # minikube builds straight into the cluster's image store
  tagPolicy:
    inputDigest: {}        # the tag is the content: a rebuild of the same sources is a no-op
  artifacts:
    - image: ghcr.io/likho-ai/likho-api
      context: ../likho-api
    - image: ghcr.io/likho-ai/likho-media
      context: ../likho-media
    - image: ghcr.io/likho-ai/likho-transcription
      context: ../likho-transcription
    - image: ghcr.io/likho-ai/likho-language
      context: ../likho-language
    - image: ghcr.io/likho-ai/likho-web-shell
      context: ../likho-web-shell
    - image: ghcr.io/likho-ai/likho-mfe-library
      context: ../likho-mfe-library
    - image: ghcr.io/likho-ai/likho-mfe-transcript
      context: ../likho-mfe-transcript

manifests:
  rawYaml: [rendered/local/likho.yaml]
  hooks:
    before:
      - host:
          command: [uv, run, python, scripts/render.py, local]
          os: [windows, linux, darwin]

deploy:
  kubectl:
    defaultNamespace: likho
  statusCheckDeadlineSeconds: 600

portForward:
  - resourceType: service
    resourceName: likho-gateway
    namespace: likho
    port: 80
    localPort: 8080
