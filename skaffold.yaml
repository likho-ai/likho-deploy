# Likho in a cluster, through Skaffold.
#
#   skaffold dev          the local cluster (minikube): builds every image from the sibling
#                         checkouts, installs the backing services and the product, forwards the
#                         gateway to http://localhost:8080, and rebuilds what you change
#   skaffold run          the same, once
#   skaffold run -p staging       the images CI published, into the staging cluster's context
#   skaffold run -p production    the pinned images, into the production context
#
# Before the first run of an environment: `uv run python scripts/secrets.py <environment>`
# (see scripts/local.ps1 for the local cluster, which does every step).
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: likho

build:
  local:
    useBuildkit: true
    concurrency: 2
    push: false            # minikube builds straight into the cluster's image store
  tagPolicy:
    inputDigest: {}        # the tag is the content: a rebuild of the same sources is a no-op
  artifacts:
    - image: ghcr.io/likho-ai/likho-api
      context: ../likho-api
    - image: ghcr.io/likho-ai/likho-media
      context: ../likho-media
    - image: ghcr.io/likho-ai/likho-transcription
      context: ../likho-transcription
    - image: ghcr.io/likho-ai/likho-language
      context: ../likho-language
    - image: ghcr.io/likho-ai/likho-web-shell
      context: ../likho-web-shell
    - image: ghcr.io/likho-ai/likho-mfe-library
      context: ../likho-mfe-library
    - image: ghcr.io/likho-ai/likho-mfe-transcript
      context: ../likho-mfe-transcript

deploy:
  helm:
    releases:
      - name: likho-stack
        chartPath: charts/likho-stack
        namespace: likho
        createNamespace: true
        valuesFiles: [environments/local/stack.yaml]
        wait: true
      - name: likho
        chartPath: charts/likho
        namespace: likho
        createNamespace: true
        valuesFiles:
          - environments/staging/env.yaml
          - environments/local/values.yaml
        setValueTemplates:
          services.likho-api.image: "{{.IMAGE_FULLY_QUALIFIED_ghcr_io_likho_ai_likho_api}}"
          services.likho-media.image: "{{.IMAGE_FULLY_QUALIFIED_ghcr_io_likho_ai_likho_media}}"
          services.likho-transcription.image: "{{.IMAGE_FULLY_QUALIFIED_ghcr_io_likho_ai_likho_transcription}}"
          services.likho-language.image: "{{.IMAGE_FULLY_QUALIFIED_ghcr_io_likho_ai_likho_language}}"
          services.likho-web-shell.image: "{{.IMAGE_FULLY_QUALIFIED_ghcr_io_likho_ai_likho_web_shell}}"
          services.likho-mfe-library.image: "{{.IMAGE_FULLY_QUALIFIED_ghcr_io_likho_ai_likho_mfe_library}}"
          services.likho-mfe-transcript.image: "{{.IMAGE_FULLY_QUALIFIED_ghcr_io_likho_ai_likho_mfe_transcript}}"
        wait: true
  statusCheckDeadlineSeconds: 900   # the transcription image and the model take a while the first time

portForward:
  - resourceType: service
    resourceName: likho-gateway
    namespace: likho
    port: 80
    localPort: 8080

profiles:
  # The real environments: nothing is built here; the images come from GitHub Container Registry.
  - name: staging
    patches:
      - op: replace
        path: /build
        value: { artifacts: [] }
      - op: remove
        path: /portForward
    deploy:
      helm:
        releases:
          - name: likho-stack
            chartPath: charts/likho-stack
            namespace: likho-staging
            createNamespace: true
            valuesFiles: [environments/staging/stack.yaml]
            wait: true
          - name: likho
            chartPath: charts/likho
            namespace: likho-staging
            createNamespace: true
            valuesFiles:
              - environments/staging/env.yaml
              - environments/staging/values.yaml
            wait: true
      statusCheckDeadlineSeconds: 900

  - name: production
    patches:
      - op: replace
        path: /build
        value: { artifacts: [] }
      - op: remove
        path: /portForward
    deploy:
      helm:
        releases:
          - name: likho-stack
            chartPath: charts/likho-stack
            namespace: likho-production
            createNamespace: true
            valuesFiles: [environments/production/stack.yaml]
            wait: true
          - name: likho
            chartPath: charts/likho
            namespace: likho-production
            createNamespace: true
            valuesFiles:
              - environments/production/env.yaml
              - environments/production/values.yaml
            wait: true
      statusCheckDeadlineSeconds: 900
